name: Promotion guardrails

# dev -> main promotion in this repository is fast-forward-only, by direct
# push (git push origin dev:main) after dev's own SHA has gone green on its
# required checks -- never GitHub's merge button. This workflow is the
# opum-doc ODOC-73 pattern for backing that with active detection: on
# 2026-08-31, `gh pr merge --squash` landed a dev-to-main promotion PR in
# opum-doc, stapling a merge commit onto main that dev never had and
# breaking the fast-forward ancestor relationship the two-branch model
# depends on. See CLAUDE.md's Ownership section for the actual procedure.
#
# Deliberately NOT wired into main's required_status_checks ruleset:
# GitHub gates a direct push by the pushed commit's own PRIOR check history,
# regardless of which event triggered the workflow that produced it. A
# check scoped to pull_request PRs targeting main never runs in any other
# context, so dev's tip commit would never carry a passing record for it --
# requiring it would make `git push origin dev:main`, the one correct
# promotion path, permanently unpushable. Verified empirically in opum-doc
# before shipping there; do not add either job name to
# repos/opum-ai/quest-cli/rules/branches/main without re-verifying that
# reasoning first.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# QCLI-326 (OPAG-166) considered and REJECTED adding a concurrency
# cancellation group here, on re-measurement rather than the "free, add it
# everywhere" assumption the task started with. This workflow only triggers
# on pushes/PRs to `main` (see `on:` above) -- never a feature branch -- so
# there are no superseded runs to collapse: quest-cli's own history this
# month is 39 push + 39 pull_request, all against `main`, zero stacking.
# What cancellation would buy instead is suppressing the guard itself: two
# promotions in quick succession would cancel the first one's fast-forward
# check, and the deliberate failure telling a human not to use the merge
# button could disappear along with it. Do not add this back without
# re-verifying both of those hold.
jobs:
  promotion-is-manual:
    name: promotion-is-manual
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: A PR is never how dev reaches main here
        run: |
          echo "::error::dev -> main promotion is fast-forward-only in this repository: open this PR to let required checks run on dev's own SHA, then land it with 'git push origin dev:main' -- never the merge button above. Merging this PR would staple a merge commit onto main that dev never had, breaking the fast-forward relationship the two-branch model depends on. See CLAUDE.md's Ownership section."
          exit 1

  main-is-fast-forward-of-dev:
    name: main-is-fast-forward-of-dev
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          # Load-bearing twice: the shallow default clone has neither main's
          # previous HEAD nor enough history for either is-ancestor test.
      - name: main must have moved forward, and from dev
        env:
          BEFORE_SHA: ${{ github.event.before }}
          FORCED: ${{ github.event.forced }}
        # QCLI-314. This was an inline `run:` asserting only
        # `git merge-base --is-ancestor HEAD origin/dev` and then reporting
        # "main's new HEAD is a fast-forward of dev" -- containment measured,
        # fast-forwardness claimed. It passed a force-push rewind of main to
        # an older commit still on dev. Extracting it is the load-bearing
        # half of the fix: inline here it had no tests by construction, which
        # is how the defect survived in eight repositories. The script's own
        # header carries the reasoning, and its test file asserts the
        # emitted verdict and not only the exit code.
        run: node scripts/qualification/promotion-fast-forward.mjs
