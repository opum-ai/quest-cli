name: Projection platform matrix

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/projection-platform.yml"
      - "bun.lock"
      - "package.json"
      - "src/adapters/projection/**"
      - "src/application/projection/**"
      - "test/integration/projection/**"

permissions:
  contents: read

jobs:
  projection:
    name: ${{ matrix.platform }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            arch: x64
            runner: ubuntu-24.04
            quarantined: false
          - platform: ubuntu-24.04
            arch: arm64
            runner: ubuntu-24.04-arm
            quarantined: false
          - platform: macos-15
            arch: x64
            runner: macos-15-intel
            quarantined: false
          - platform: macos-14
            arch: arm64
            runner: macos-14
            quarantined: false
          - platform: windows-2022
            arch: x64
            runner: windows-2022
            quarantined: false
          - platform: windows-11
            arch: arm64
            runner: windows-11-arm
            quarantined: true # QCLI-111 restores this required lane.
    continue-on-error: ${{ matrix.quarantined }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --linker=isolated
      - run: bun test --timeout 15000 test/integration/projection/sqlite-projection.test.ts
