name: Projection platform matrix

# QCLI-326. This used to trigger on `push` with a `paths:` filter but no
# `branches:` restriction, so it ran the full six-platform matrix (including
# two macOS legs) on every push to any branch that touched the matched
# paths -- 24 runs in September, roughly half of them on task branches mid-
# review rather than dev/main merges, against a 41%-of-fleet GitHub Actions
# bill (OPAG-166). Scoped to workflow_dispatch or a tag push only, matching
# prepublication-qualification.yml's immutable-candidates. Cross-platform
# projection regressions now surface at tag time (or an explicit
# workflow_dispatch) rather than on every dev push -- a deliberate trade of
# earlier signal for cost, not an oversight.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  projection:
    name: ${{ matrix.platform }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            arch: x64
            runner: ubuntu-24.04
          - platform: ubuntu-24.04
            arch: arm64
            runner: ubuntu-24.04-arm
          - platform: macos-15
            arch: x64
            runner: macos-15-intel
          - platform: macos-14
            arch: arm64
            runner: macos-14
          - platform: windows-2022
            arch: x64
            runner: windows-2022
          - platform: windows-11
            arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --linker=isolated
      - name: Run projection tests
        env:
          QUEST_PROJECTION_RELEASE_DIAGNOSTICS: "1"
        run: bun test test/integration/projection/sqlite-projection.test.ts
