name: Release

# Publication is never automatic. This runs only when a human dispatches it
# against a release tag, and it refuses to publish anything unless a
# native-execution receipt binds that exact commit and version (QCLI-135).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually publish. Leave false for a dry run."
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  publish:
    # Dispatch this against the tag, not a branch: the artifacts published are
    # the ones committed at the release ref, and nothing here rebuilds them.
    # Bun's --compile output is not byte-reproducible, so a rebuild would
    # publish different bytes from the ones CI attested.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    # Both permutations were tested against npm 11.19.1 and both returned the
    # same E404: with `environment: release` (run 33298452455) and with no
    # environment at all (run 33299187110). So the environment claim is not the
    # discriminator, and no trust relationship exists for these packages.
    #
    # Kept declared rather than dropped, matching lore-cli's working job, and
    # because an environment is the hook for the second-party review recorded
    # as missing on QCLI-97.6. The npm-side configuration must name `release`
    # to match.
    environment: release
    permissions:
      contents: read
      actions: read
      # Trusted publishing (OIDC). npm verifies a short-lived token minted by
      # GitHub against a trust relationship configured once per package, so
      # nothing is stored and nothing expires.
      #
      # This is not a preference. npm restricted classic tokens for direct
      # publishing; both a local publish and this workflow's stored NPM_TOKEN
      # return E404 on PUT, which is what npm returns for a token that cannot
      # write to the scope. Granular tokens are capped at 90 days and must be
      # made on the website, so a token-based release stops working every
      # quarter and surfaces as a stalled release rather than a warning.
      #
      # Requires a one-time setup per package at
      # https://www.npmjs.com/package/<name>/access — all seven names
      # separately — naming this repository, this workflow filename, and the
      # publish action. npm does not validate those fields on save, so a typo
      # shows up only as a failed publish.
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0. Pinned to
      # the ^11 major rather than @latest: this is the only job with
      # `id-token: write`, so an unpinned global install of npm's own CLI would
      # run a brand-new npm release with publish capability the moment it ships.
      - run: npm install --global npm@^11
      # Assert the floor rather than assume the upgrade took. An npm below the
      # floor does not announce itself — it simply never attempts OIDC and
      # falls back to token auth, which surfaces as an opaque E404 from the
      # registry. That is indistinguishable from "no trust relationship", and
      # cost several publish attempts before it was suspected.
      - name: Assert the npm OIDC floor
        run: |
          set -euo pipefail
          version=$(npm --version)
          echo "npm ${version}, node $(node --version)"
          node -e '
            const [major, minor, patch] = process.argv[1].split("-")[0].split(".").map(Number);
            const ok =
              major > 11 ||
              (major === 11 &&
                (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) {
              console.error(`npm ${process.argv[1]} is older than the 11.5.1 trusted-publishing floor`);
              process.exit(1);
            }
          ' "$version"

      # The receipt is fetched from the qualification run for this exact
      # commit, not passed in. A receipt supplied by the person publishing is
      # not evidence.
      - name: Fetch the native-execution receipt for this commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_id=$(gh run list \
            --workflow prepublication-qualification.yml \
            --commit "${GITHUB_SHA}" \
            --status success \
            --limit 20 \
            --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion=="success")][0].databaseId')
          test -n "$run_id" || { echo "No successful qualification run for ${GITHUB_SHA}"; exit 1; }
          echo "Receipt comes from qualification run ${run_id}"
          gh run download "$run_id" --name native-execution-receipt --dir receipt

      - name: Gate on the receipt
        run: node scripts/qualification/native-execution-receipt.mjs --require --receipt receipt/native-execution-receipt.json

      # QCLI-267. The tag, the commit and package.json must agree, and the
      # commit must be reachable from main. A tag outside the mainline is the
      # shape that outlives the history it pointed into: @opum-ai/quest 0.6.0
      # records gitHead=ce551cf4, which no longer exists anywhere, while the
      # v0.6.0 tag peels to the post-recreation initial commit. Nothing on
      # either side noticed; a downstream site found it as a 404 in production.
      - name: Gate on release provenance
        run: node scripts/qualification/release-provenance.mjs --pre

      # Fail on the credential BEFORE touching the registry, and say which
      # fault it is. npm returns E404 on PUT both for a token that cannot write
      # to the scope and for one that is not a token at all, so the publish
      # error alone does not distinguish "rotate the token" from "configure
      # trusted publishing" — and those are different fixes.
      #
      # `unset` here too: without it, `npm whoami` authenticates against
      # `setup-node`'s placeholder NODE_AUTH_TOKEN (see the Publish step's env
      # comment) rather than reporting the no-token/OIDC state this step
      # exists to distinguish.
      - name: Preflight the publish credential
        continue-on-error: true
        run: |
          set +e
          unset NODE_AUTH_TOKEN
          echo "::group::whoami"
          who=$(npm whoami 2>&1); code=$?
          echo "$who"
          echo "::endgroup::"
          if [ $code -ne 0 ]; then
            echo "::warning::No usable token; publication depends on trusted publishing (OIDC) being configured for these packages."
          else
            echo "::notice::A stored credential authenticates as ${who}. An E404 on PUT below therefore means the token lacks write access to the @opum-ai scope, not that it is invalid."
            echo "::group::access"
            npm access list packages "$who" 2>&1 | head -20
            echo "::endgroup::"
          fi

      # Platform packages first: the root's optionalDependencies name them, so
      # publishing the root first would briefly advertise versions that do not
      # exist.
      - name: Publish
        env:
          # CORRECTED 2026-09-13 (lore-cli, reading npm's own source --
          # lib/commands/publish.js calls oidc() unconditionally BEFORE
          # getCredentialsByURI reads any stored/env token, and oidc.js has no
          # early return on an existing NODE_AUTH_TOKEN; verified byte-identical
          # in npm 11.19.1, what this job installs, and 12.0.2). The prior note
          # here claimed the placeholder from `setup-node`'s registry-url
          # handling (`NODE_AUTH_TOKEN=XXXXX-XXXXX-XXXXX-XXXXX` when unset) made
          # npm skip OIDC outright. That is wrong: the OIDC exchange is always
          # attempted first. What actually happens is `oidc()` swallowing the
          # exchange failure (log.verbose only) and falling back to whatever
          # `.npmrc` holds -- with the placeholder present that is a PUT with a
          # fake token (E404); without it, ENEEDAUTH. Same underlying failure,
          # clearer error. The real cause is the OIDC exchange itself being
          # rejected (immutable-subject-claim mismatch with npm Trusted
          # Publishing -- see QCLI-271), not this placeholder. `unset` below is
          # kept for the clearer error only, not because it enables OIDC.
          # NPM_CONFIG_LOGLEVEL=verbose surfaces oidc.js's swallowed exchange
          # message instead of inferring the cause three layers downstream.
          NPM_CONFIG_LOGLEVEL: verbose
          DRY: ${{ inputs.publish == true && ' ' || '--dry-run' }}
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            echo "::group::@opum-ai/quest-${target}"
            (cd "npm/quest-${target}" && npm publish --access public $DRY)
            echo "::endgroup::"
          done
          echo "::group::@opum-ai/quest"
          npm publish --access public $DRY
          echo "::endgroup::"

      # Retries, because npm's CDN does not serve a version the instant the
      # publish returns. The first run of this step failed with "E404 No match
      # found for version 0.3.0" SECONDS AFTER a successful publish, marking a
      # completed release as a failed one. A red run on a successful publish is
      # how a real failure gets ignored later, so this waits for propagation
      # rather than reporting the lag as a defect.
      #
      # QCLI-247. The original fixed 30s x 10 (5 minutes flat, no backoff)
      # budget false-failed the whole run on 0.4.0 and 0.5.0 alike -- 2 for 2.
      # Both times every package but quest-win32-arm64 was visible well inside
      # that window; win32-arm64's own publish log showed npm's own "being
      # processed and may take a few minutes to become available" notice, and
      # it then resolved on independent polling shortly after the 5-minute
      # cutoff, with no republish needed (0.4.0: docs/reference/quest-cli-
      # release-truth.md "Current publication state (2026-09-07)"; 0.5.0:
      # QCLI-242's implementation notes). Neither record carries an exact
      # resolution time -- the workflow run logs that would have it no longer
      # exist after the 2026-09-10 repository deletion/recreation (QCLI-267)
      # -- so this budget is sized as a multiple of the window that already
      # failed twice, not a fresh guess: up to 12 checks with exponential
      # backoff (15s, 30s, 60s, then 90s), ~13m45s of total wait before giving
      # up. That clears "shortly after" a 5-minute miss with roughly 2.75x
      # margin, while the doubling keeps the common case (all seven visible on
      # the first check) just as fast as before and avoids hammering the
      # registry once a package is already known to be lagging.
      - name: Verify the registry serves what was published
        if: ${{ inputs.publish == true }}
        run: |
          set -uo pipefail
          version=$(node -p "require('./package.json').version")
          names="quest quest-darwin-arm64 quest-darwin-x64 quest-linux-arm64 quest-linux-x64 quest-win32-arm64 quest-win32-x64"
          max_attempts=12
          delay=15
          elapsed=0
          for attempt in $(seq 1 "$max_attempts"); do
            missing=""
            for name in $names; do
              npm view "@opum-ai/${name}@${version}" version >/dev/null 2>&1 || missing="${missing} ${name}"
            done
            if [ -z "$missing" ]; then
              echo "all seven packages visible on the registry (after ${attempt} checks, ~${elapsed}s elapsed)"
              break
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::registry propagation timeout: still not visible after ${attempt} checks over ~${elapsed}s (~$((elapsed / 60))m):${missing}. This means the package(s) never appeared under ${version} in that window at all -- npm-side CDN/attestation-processing lag, the same class observed on 0.4.0 and 0.5.0's quest-win32-arm64, both of which resolved shortly after a shorter 5-minute budget. This is NOT a content mismatch: a package visible under the right version but serving the wrong bytes is a different, real failure and is reported separately below, after this loop passes."
              exit 1
            fi
            echo "still waiting for CDN propagation (attempt ${attempt}/${max_attempts}, next check in ${delay}s):${missing}"
            sleep "$delay"
            elapsed=$((elapsed + delay))
            if [ "$delay" -lt 90 ]; then
              delay=$((delay * 2))
              [ "$delay" -gt 90 ] && delay=90
            fi
          done
          set -e
          # The receipt claims specific bytes. Prove the registry serves them.
          # A failure here is a different class of problem from the loop
          # above: every package is already confirmed visible by this point,
          # so a red run here means the registry serves the wrong content
          # under the right version -- a real mismatch, not propagation lag.
          if ! node scripts/qualification/native-execution-receipt.mjs \
            --verify-published "$version" --receipt receipt/native-execution-receipt.json; then
            echo "::error::registry content mismatch: all seven packages are visible as ${version}, but the published bytes do not match the native-execution receipt (mismatch detail above). This is a real defect, not propagation lag."
            exit 1
          fi

      # QCLI-267, the half that names the defect directly: the registry's own
      # gitHead for what was just published must be the commit it was released
      # from. This is the only moment both halves exist and can be compared --
      # afterwards a history rewrite can silently make the claim false, and
      # nothing can repair it. A red here is a real release problem, not CDN
      # lag: the step above has already waited for propagation.
      - name: Verify the registry's provenance matches what was released
        if: ${{ inputs.publish == true }}
        run: node scripts/qualification/release-provenance.mjs --post
