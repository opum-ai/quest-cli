name: Prepublication qualification

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - dev
  push:
    paths:
      - ".github/workflows/prepublication-qualification.yml"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "scripts/qualification/**"
      - "scripts/check-package-artifacts.mjs"
      - "scripts/deliver-package-artifacts.mjs"
      - "scripts/test-package-artifact-delivery.mjs"
      - "scripts/test-packed-packages.mjs"
      - "scripts/build-platform-packages.mjs"
      - "bin/**"
      - "npm/**"
      - "src/**"
      - "test/**"

permissions:
  contents: read

jobs:
  operating-block:
    name: operating block digest
    runs-on: ubuntu-24.04
    env:
      EXPECTED_DIGEST: 9eddf7883da91a63
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: CLAUDE.md operating block matches the fleet digest
        run: |
          set -euo pipefail
          block=$(awk '/opum:fleet-operating:begin/,/opum:fleet-operating:end/' CLAUDE.md)
          if [ -z "$block" ]; then echo "::error::no opum:fleet-operating block in CLAUDE.md"; exit 1; fi
          actual=$(printf '%s\n' "$block" | sha256sum | cut -c1-16)
          echo "expected $EXPECTED_DIGEST"
          echo "actual   $actual"
          if [ "$actual" != "$EXPECTED_DIGEST" ]; then
            echo "::error::operating block has drifted. It is byte-identical in all five repos by design; a local edit here is a defect. To change it deliberately: update the canonical doc in opum-doc, propagate to all five CLAUDE.md files, then update EXPECTED_DIGEST in all five workflows."
            exit 1
          fi

  source-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --linker=isolated
      - run: npm install --global @salient-ai/jira-cli@1.0.2
      - run: bun scripts/qualification/prepublish.mjs
        env:
          QUEST_QUALIFICATION_SOURCE: "1"
          QUEST_QUALIFICATION_SKIP_CANDIDATE: "1"
          QUEST_QUALIFICATION_STRICT: "1"

  # The six-platform release matrix is too slow and too expensive to run on
  # every PR. source-gates alone (typecheck, lint, format, layer boundaries,
  # and the full test suite) is the required PR check; this job stays scoped
  # to push/workflow_dispatch/tag builds, matching its existing behavior.
  immutable-candidates:
    name: ${{ matrix.target }}
    needs: source-gates
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-14
          - target: win32-x64
            runner: windows-2022
          - target: win32-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --linker=isolated
      # On a release ref the committed artifact is the thing being published,
      # so it is executed as-is. Rebuilding it first would destroy exactly what
      # the receipt attests: Bun's --compile output is not byte-reproducible, so
      # a rebuild is a DIFFERENT artifact from the one shipped (QCLI-135).
      - run: bun run build:packages
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          QUEST_BUN_TARGET: ${{ matrix.target }}
      - name: Attest the committed artifact
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/qualification/native-execution-receipt.mjs --verify-committed ${{ matrix.target }}
      - run: bun scripts/qualification/prepublish.mjs
        env:
          QUEST_QUALIFICATION_TARGET: ${{ matrix.target }}
          QUEST_QUALIFICATION_STRICT: "1"
      # Only this runner can build this target — Bun cannot cross-compile
      # bun-windows-aarch64 at all — so the package it just built is uploaded
      # for the bundle job to collect. Without this a six-platform candidate
      # could not be assembled anywhere.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: >-
          github.event_name == 'workflow_dispatch' ||
          startsWith(github.ref, 'refs/tags/v')
        with:
          name: quest-package-${{ matrix.target }}
          path: npm/quest-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  # A digest-pinned bundle of an UNPUBLISHED build, so downstream qualification
  # can exercise changes without them reaching a registry first. See the header
  # of scripts/build-candidate-bundle.mjs for what binding one gains and loses.
  candidate-bundle:
    name: candidate-bundle
    needs: immutable-candidates
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: quest-package-*
          path: artifacts
      - name: Collect the six platform packages
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            src="artifacts/quest-package-${target}"
            test -d "$src" || { echo "missing artifact for ${target}"; exit 1; }
            rm -rf "npm/quest-${target}"
            mkdir -p "npm/quest-${target}"
            cp -R "$src/." "npm/quest-${target}/"
          done
          # Artifact upload does not preserve the executable bit, and npm pack
          # records the mode it finds. Without this the published binary would
          # install unrunnable.
          # ALL SIX, including the .exe files: they are committed 100755, so
          # restoring only the four POSIX ones leaves the Windows packages
          # differing from the committed artifact by MODE. The release
          # provenance check refuses that, correctly — it would otherwise
          # ship a tarball that is not the one attested.
          chmod +x npm/quest-darwin-arm64/bin/quest npm/quest-darwin-x64/bin/quest \
                   npm/quest-linux-arm64/bin/quest npm/quest-linux-x64/bin/quest \
                   npm/quest-win32-arm64/bin/quest.exe npm/quest-win32-x64/bin/quest.exe
      - run: node scripts/build-candidate-bundle.mjs --out candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quest-candidate-bundle
          path: candidate
          if-no-files-found: error
          retention-days: 14

  # The receipt is generated by CI, from CI's own run metadata, and never by
  # hand afterwards. QCLI-135 was filed because a hand-made receipt outlived
  # the release it described and six downstream qualification rows moved from
  # BLOCKED to FAIL — a worse evidential position than no receipt at all.
  native-execution-receipt:
    name: native-execution-receipt
    needs: immutable-candidates
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Emit the receipt
        run: node scripts/qualification/native-execution-receipt.mjs --out native-execution-receipt.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The same gate the release runbook applies, run here so a receipt that
      # could not authorize a publish never becomes an artifact at all.
      - name: Gate the receipt
        run: node scripts/qualification/native-execution-receipt.mjs --require --receipt native-execution-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-execution-receipt
          path: native-execution-receipt.json
          if-no-files-found: error
