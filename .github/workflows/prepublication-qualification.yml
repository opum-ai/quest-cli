name: Prepublication qualification

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/prepublication-qualification.yml"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "scripts/qualification/**"
      - "scripts/check-package-artifacts.mjs"
      - "scripts/deliver-package-artifacts.mjs"
      - "scripts/test-package-artifact-delivery.mjs"
      - "scripts/test-packed-packages.mjs"
      - "scripts/build-platform-packages.mjs"
      - "bin/**"
      - "npm/**"
      - "src/**"
      - "test/**"

permissions:
  contents: read

jobs:
  source-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --linker=isolated
      - run: npm install --global @salient-ai/jira-cli@1.0.2
      - run: bun scripts/qualification/prepublish.mjs
        env:
          QUEST_QUALIFICATION_SOURCE: "1"
          QUEST_QUALIFICATION_SKIP_CANDIDATE: "1"
          QUEST_QUALIFICATION_STRICT: "1"

  immutable-candidates:
    name: ${{ matrix.target }}
    needs: source-gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-14
          - target: win32-x64
            runner: windows-2022
          - target: win32-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --linker=isolated
      - run: bun run build:packages
        env:
          QUEST_BUN_TARGET: ${{ matrix.target }}
      - run: bun scripts/qualification/prepublish.mjs
        env:
          QUEST_QUALIFICATION_TARGET: ${{ matrix.target }}
          QUEST_QUALIFICATION_STRICT: "1"
