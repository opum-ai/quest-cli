name: Prepublication qualification

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/prepublication-qualification.yml"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "scripts/qualification/**"
      - "scripts/check-package-artifacts.mjs"
      - "scripts/deliver-package-artifacts.mjs"
      - "scripts/test-package-artifact-delivery.mjs"
      - "scripts/test-packed-packages.mjs"
      - "scripts/build-platform-packages.mjs"
      - "bin/**"
      - "npm/**"
      - "src/**"
      - "test/**"

permissions:
  contents: read

jobs:
  source-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --linker=isolated
      - run: npm install --global @salient-ai/jira-cli@1.0.2
      - run: bun scripts/qualification/prepublish.mjs
        env:
          QUEST_QUALIFICATION_SOURCE: "1"
          QUEST_QUALIFICATION_SKIP_CANDIDATE: "1"
          QUEST_QUALIFICATION_STRICT: "1"

  immutable-candidates:
    name: ${{ matrix.target }}
    needs: source-gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-14
          - target: win32-x64
            runner: windows-2022
          - target: win32-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --linker=isolated
      - run: bun run build:packages
        env:
          QUEST_BUN_TARGET: ${{ matrix.target }}
      # On a release ref the rebuild must reproduce the digest committed at
      # that ref. Without this the run proves only that a binary built from
      # this source executes here, not that the bytes we publish do, and a
      # receipt assembled from it would claim more than it earned (QCLI-135).
      - name: Reproduce the committed digest
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/qualification/native-execution-receipt.mjs --verify-reproduction ${{ matrix.target }}
      - run: bun scripts/qualification/prepublish.mjs
        env:
          QUEST_QUALIFICATION_TARGET: ${{ matrix.target }}
          QUEST_QUALIFICATION_STRICT: "1"

  # The receipt is generated by CI, from CI's own run metadata, and never by
  # hand afterwards. QCLI-135 was filed because a hand-made receipt outlived
  # the release it described and six downstream qualification rows moved from
  # BLOCKED to FAIL — a worse evidential position than no receipt at all.
  native-execution-receipt:
    name: native-execution-receipt
    needs: immutable-candidates
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Emit the receipt
        run: node scripts/qualification/native-execution-receipt.mjs --out native-execution-receipt.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The same gate the release runbook applies, run here so a receipt that
      # could not authorize a publish never becomes an artifact at all.
      - name: Gate the receipt
        run: node scripts/qualification/native-execution-receipt.mjs --require --receipt native-execution-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-execution-receipt
          path: native-execution-receipt.json
          if-no-files-found: error
